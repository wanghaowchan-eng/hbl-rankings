        let currentPosFilter = 'ALL';

        // Render Table
        function renderTable(data) {
            const tbody = document.getElementById('playerTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-500">尚無符合條件的球員資料</td></tr>`;
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 transition cursor-pointer border-b border-gray-800/40";
                tr.onclick = () => openModal(p);

                const starIcons = '⭐'.repeat(p.stars);
                const rankBadgeClass = p.rank === 1 ? 'bg-amber-500 text-black' : p.rank <= 3 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-gray-800 text-gray-300';

                tr.innerHTML = `
                    <td class="px-4 py-3 text-center">
                        <span class="inline-block px-2.5 py-1 rounded font-black font-teko text-base ${rankBadgeClass}">
                            #${p.rank}
                        </span>
                    </td>
                    <td class="px-6 py-3">
                        <div class="flex items-center gap-3">
                            <img src="${p.img}" class="w-10 h-10 rounded-full object-cover border border-gray-700" alt="${p.name}">
                            <div>
                                <div class="font-bold text-white">${p.name}</div>
                                <div class="text-xs text-gray-400">${p.pos}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-3 font-medium text-gray-300">${p.school}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="bg-gray-800 text-gray-300 text-xs px-2 py-1 rounded border border-gray-700">${p.pos}</span>
                    </td>
                    <td class="px-4 py-3 text-center font-mono text-sm">${p.height}</td>
                    <td class="px-4 py-3 text-center text-xs">${starIcons}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="font-teko font-bold text-xl text-amber-400">${p.rating}</span>
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button class="bg-gray-800 hover:bg-amber-500 hover:text-black text-gray-300 text-xs px-3 py-1 rounded transition">分析</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Filter Logic
        function filterPos(pos) {
            currentPosFilter = pos;
            document.querySelectorAll('.pos-btn').forEach(btn => {
                if(btn.innerText.includes(pos) || (pos === 'ALL' && btn.innerText.includes('全部'))) {
                    btn.className = "pos-btn bg-amber-500 text-black px-3 py-1 rounded-md text-xs font-bold transition";
                } else {
                    btn.className = "pos-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1 rounded-md text-xs font-bold transition";
                }
            });
            applyFilters();
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = players.filter(p => {
                const matchPos = currentPosFilter === 'ALL' || p.pos.includes(currentPosFilter);
                const matchQuery = p.name.toLowerCase().includes(query) || p.school.toLowerCase().includes(query);
                return matchPos && matchQuery;
            });
            renderTable(filtered);
        }

        // Modal Logic
        function openModal(player) {
            document.getElementById('mImg').src = player.img;
            document.getElementById('mName').innerText = player.name;
            document.getElementById('mSchool').innerText = player.school;
            document.getElementById('mSub').innerText = `${player.pos} | ${player.height}`;
            document.getElementById('mRating').innerText = player.rating;
            document.getElementById('mStars').innerText = '⭐'.repeat(player.stars);
            document.getElementById('mRank').innerText = `#${player.rank}`;
            document.getElementById('mReport').innerText = player.report;
            document.getElementById('mCeiling').innerText = player.ceiling;

            document.getElementById('playerModal').classList.remove('hidden');

            // Render Chart
            renderChart(player.stats);
        }

        function closeModal() {
            document.getElementById('playerModal').classList.add('hidden');
        }

        function renderChart(statsData) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['進攻技巧', '身體天賦', '爆發力', '防守意識', '球商', '發展上限'],
                    datasets: [{
                        label: '能力評分',
                        data: statsData,
                        backgroundColor: 'rgba(245, 158, 11, 0.25)',
                        borderColor: 'rgba(245, 158, 11, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(245, 158, 11, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#9ca3af', font: { size: 11 } },
                            ticks: { display: false, backdropColor: 'transparent' },
                            suggestedMin: 50,
                            suggestedMax: 100
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Initial Load
        renderTable(players);
    </script>
</body>
</html>
